version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Auth required; never published on the host (only reachable on the compose network)
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway-node:
    build:
      context: ../..
      dockerfile: apps/api-gateway-node/Dockerfile
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - UPLOAD_SERVICE_URL=http://upload-service-node:3001
      - ANALYTICS_API_URL=http://analytics-api-node:3002
      # One proxy (the frontend nginx) sits in front of the gateway
      - TRUST_PROXY=1
      # End-user authentication: OIDC access tokens are verified here (see README "Authentication")
      - OIDC_ISSUER=${OIDC_ISSUER:?Set OIDC_ISSUER}
      - OIDC_AUDIENCE=${OIDC_AUDIENCE:?Set OIDC_AUDIENCE}
      - OIDC_REQUIRED_SCOPE=${OIDC_REQUIRED_SCOPE:-}
      - OIDC_JWKS_URI=${OIDC_JWKS_URI:-}
      - NODE_ENV=production
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - postgres
      - redis

  upload-service-node:
    build:
      context: ../..
      dockerfile: apps/upload-service-node/Dockerfile
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      # Only reachable through the gateway, so X-Forwarded-For from one hop is trusted
      - TRUST_PROXY=1
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      - NODE_ENV=production
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - uploads_data:/app/uploads
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - postgres
      - redis

  analytics-api-node:
    build:
      context: ../..
      dockerfile: apps/analytics-api-node/Dockerfile
    environment:
      - POSTGRES_HOST=postgres
      - TRUST_PROXY=1
      - NODE_ENV=production
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - postgres

  ocr-worker-python:
    build:
      context: ../..
      dockerfile: apps/ocr-worker-python/Dockerfile
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - TESSERACT_LANG=eng
    volumes:
      - uploads_data:/app/uploads:ro
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    depends_on:
      - redis

  parser-worker-python:
    build:
      context: ../..
      dockerfile: apps/parser-worker-python/Dockerfile
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - UPLOAD_SERVICE_URL=http://upload-service-node:3001
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - postgres
      - redis

  matcher-worker-node:
    build:
      context: ../..
      dockerfile: apps/matcher-worker-node/Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - postgres
      - redis

  insights-worker-python:
    build:
      context: ../..
      dockerfile: apps/insights-worker-python/Dockerfile
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - postgres
      - redis

  export-worker-node:
    build:
      context: ../..
      dockerfile: apps/export-worker-node/Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - exports_data:/app/exports
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    depends_on:
      - postgres
      - redis

  frontend-dashboard:
    build:
      context: ../..
      dockerfile: apps/frontend-dashboard/Dockerfile
      args:
        VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:?Set OIDC_ISSUER}
        VITE_OIDC_CLIENT_ID: ${OIDC_SPA_CLIENT_ID:?Set OIDC_SPA_CLIENT_ID}
        VITE_OIDC_SCOPE: ${OIDC_SPA_SCOPE:-openid profile email}
        VITE_OIDC_AUDIENCE: ${OIDC_SPA_AUDIENCE:-}
    environment:
      - OIDC_ISSUER_ORIGIN=${OIDC_ISSUER_ORIGIN:?Set OIDC_ISSUER_ORIGIN (scheme://host of OIDC_ISSUER)}
    ports:
      - '80:8080'
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      - api-gateway-node

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  exports_data:

networks:
  default:
    name: resume-platform-network
