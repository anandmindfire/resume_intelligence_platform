version: '3.8'

# Infrastructure services for Resume Intelligence Platform
# Run AFTER microservices: ./scripts/start-all-services.sh --build --infra
# Paths are relative to infra/docker/ (../ = infra/)

services:
  # Prometheus for metrics (needs resume-platform to scrape app services)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - monitoring
      - resume-platform
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../monitoring/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - '127.0.0.1:9090:9090'
    restart: unless-stopped

  # Grafana for visualization (port 3030 to avoid conflict with upload-service:3001)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - '127.0.0.1:3030:3000'
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: unless-stopped

  # Alertmanager for alerts
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    networks:
      - monitoring
    restart: unless-stopped

  # Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ../logging/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - '127.0.0.1:3100:3100'
    networks:
      - logging
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Promtail for log collection
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ../logging/promtail-config.yml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - logging
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - '127.0.0.1:9100:9100'
    networks:
      - monitoring
    restart: unless-stopped

  # PostgreSQL Exporter (requires postgres on resume-platform network)
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      # Credentials are passed separately rather than interpolated into a URL, so passwords containing
      # URL-special characters (@ : / ? #) work and aren't mangled.
      DATA_SOURCE_URI: 'postgres:5432/${POSTGRES_DB:-resume_platform}?sslmode=disable'
      DATA_SOURCE_USER: '${POSTGRES_USER:-postgres}'
      DATA_SOURCE_PASS: '${POSTGRES_PASSWORD:-postgres}'
    ports:
      - '127.0.0.1:9187:9187'
    networks:
      - resume-platform
    restart: unless-stopped

  # Redis Exporter (requires redis on resume-platform network)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: 'redis:6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD:-}'
    ports:
      - '127.0.0.1:9121:9121'
    networks:
      - resume-platform
    restart: unless-stopped

networks:
  resume-platform:
    external: true
  monitoring:
    driver: bridge
  logging:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
