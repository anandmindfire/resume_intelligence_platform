apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-worker
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: ocr-worker
    app.kubernetes.io/component: worker
    {{- include "resume-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workers.ocr.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ocr-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocr-worker
        app.kubernetes.io/component: worker
        {{- include "resume-platform.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # Images run as an unprivileged user; refuse to start if one ever runs as root
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - ocr-worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ocr-worker
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.workers.ocr.image.repository }}:{{ .Values.workers.ocr.image.tag }}"
          imagePullPolicy: {{ .Values.workers.ocr.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "resume-platform.fullname" . }}-config
            - secretRef:
                name: {{ include "resume-platform.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.workers.ocr.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.path.insert(0, '/app/src'); from services.health import check_health; result = check_health(); sys.exit(0 if result['status'] == 'healthy' else 1)"
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.path.insert(0, '/app/src'); from services.health import check_health; result = check_health(); sys.exit(0 if result['status'] == 'healthy' else 1)"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: uploads-data
              mountPath: /app/uploads
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data-pvc
---
