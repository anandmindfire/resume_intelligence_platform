apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dashboard
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: frontend-dashboard
    app.kubernetes.io/component: frontend
    {{- include "resume-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-dashboard
        app.kubernetes.io/component: frontend
        {{- include "resume-platform.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # Images run as an unprivileged user; refuse to start if one ever runs as root
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - frontend-dashboard
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: "{{ if .Values.global.imageRegistry }}{{ .Values.global.imageRegistry }}/{{ end }}{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "resume-platform.fullname" . }}-config
                  key: API_GATEWAY_URL
            - name: OIDC_ISSUER_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: {{ include "resume-platform.fullname" . }}-config
                  key: OIDC_ISSUER_ORIGIN
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-dashboard
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: frontend-dashboard
    app.kubernetes.io/component: frontend
    {{- include "resume-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: frontend-dashboard

