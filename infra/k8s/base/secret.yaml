apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: resume-platform
  labels:
    app.kubernetes.io/name: platform-secrets
    app.kubernetes.io/part-of: resume-intelligence-platform
type: Opaque
stringData:
  POSTGRES_USER: 'postgres'
  POSTGRES_PASSWORD: 'postgres_production_password'
  REDIS_PASSWORD: ''
  JWT_SECRET: 'change_me_to_a_secure_jwt_secret_for_production'
  # Shared secret for service-to-service calls (parser-worker -> upload-service /api/internal/*).
  # Required in production: generate with `openssl rand -hex 32`.
  INTERNAL_API_TOKEN: 'change_me_to_a_random_internal_api_token'
