apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher-worker
  namespace: resume-platform
  labels:
    app.kubernetes.io/name: matcher-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: resume-intelligence-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: matcher-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matcher-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: resume-intelligence-platform
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - matcher-worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: matcher-worker
          image: matcher-worker-node:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
