apiVersion: apps/v1
kind: Deployment
metadata:
  name: export-worker
  namespace: resume-platform
  labels:
    app.kubernetes.io/name: export-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: resume-intelligence-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: export-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: export-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: resume-intelligence-platform
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - export-worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: export-worker
          image: export-worker-node:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: exports-data
              mountPath: /app/exports
      volumes:
        - name: exports-data
          persistentVolumeClaim:
            claimName: exports-data-pvc
