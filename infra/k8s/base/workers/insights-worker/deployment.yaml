apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-worker
  namespace: resume-platform
  labels:
    app.kubernetes.io/name: insights-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: resume-intelligence-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: insights-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: insights-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: resume-intelligence-platform
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - insights-worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: insights-worker
          image: insights-worker-python:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.path.insert(0, '/app/src'); from services.health import check_health; result = check_health(); sys.exit(0 if result['status'] == 'healthy' else 1)"
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import sys; sys.path.insert(0, '/app/src'); from services.health import check_health; result = check_health(); sys.exit(0 if result['status'] == 'healthy' else 1)"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
