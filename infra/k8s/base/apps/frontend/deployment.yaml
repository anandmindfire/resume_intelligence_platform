apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dashboard
  namespace: resume-platform
  labels:
    app.kubernetes.io/name: frontend-dashboard
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: resume-intelligence-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-dashboard
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: resume-intelligence-platform
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # Images run as an unprivileged user; refuse to start if one ever runs as root
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - frontend-dashboard
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: frontend-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: API_GATEWAY_URL
            - name: OIDC_ISSUER_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: OIDC_ISSUER_ORIGIN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '0.5'
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
