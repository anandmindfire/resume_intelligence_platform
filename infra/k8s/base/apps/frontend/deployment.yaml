apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-dashboard
  namespace: resume-platform
  labels:
    app.kubernetes.io/name: frontend-dashboard
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: resume-intelligence-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-dashboard
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: resume-intelligence-platform
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - frontend-dashboard
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: frontend-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: API_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: API_GATEWAY_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '0.5'
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
