apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: resume-platform
  labels:
    app.kubernetes.io/name: db-init-job
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: resume-intelligence-platform
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-init-job
        app.kubernetes.io/part-of: resume-intelligence-platform
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for postgres service to be ready..."
              until pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "Postgres is unavailable - sleeping 3s"
                sleep 3
              done
              echo "Postgres is up and responding!"
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_USER
      containers:
        - name: run-init-sql
          image: postgres:15-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "Applying database schema and seed data from init.sql..."
              PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f /scripts/init.sql
              echo "Database initialization completed successfully."
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: platform-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: init-sql-volume
              mountPath: /scripts/init.sql
              subPath: init.sql
      volumes:
        - name: init-sql-volume
          configMap:
            name: postgres-init-script
