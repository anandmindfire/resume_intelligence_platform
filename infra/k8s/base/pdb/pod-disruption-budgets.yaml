apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: resume-platform
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: resume-intelligence-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
