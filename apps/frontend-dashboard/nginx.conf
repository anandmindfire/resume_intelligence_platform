server {
    # Unprivileged port: the image runs nginx as a non-root user (see Dockerfile)
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Matches UPLOAD_MAX_SIZE (10 MiB) plus multipart overhead; larger bodies are rejected here, before
    # they reach the gateway.
    client_max_body_size 12m;

    # Resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=30s;

    # Security headers for the SPA. `always` so they're also sent on error responses.
    # CSP: the app's own scripts only; inline styles are needed by the charting library; Google Fonts
    # are the only other third-party origin. connect-src 'self' assumes the API is served from /api on
    # this origin (VITE_API_BASE_URL default). ${OIDC_ISSUER_ORIGIN} is the identity provider: the SPA
    # calls its token/userinfo endpoints and frames it for silent token renewal. frame-ancestors 'self'
    # (not 'none') because the silent-renew callback page is loaded in a same-origin iframe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${OIDC_ISSUER_ORIGIN}; frame-src 'self' blob: ${OIDC_ISSUER_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self' ${OIDC_ISSUER_ORIGIN}; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # Declaring add_header here stops the SPA's CSP above from being applied to API responses: the
        # services set their own headers (and served PDFs must not get object-src 'none').
        add_header X-Content-Type-Options "nosniff" always;

        # Use variable for upstream to enable dynamic resolution
        set $upstream ${API_GATEWAY_URL};
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlation id for this request: replaces any client-supplied value; the gateway adopts it and
        # forwards it to every service, so one id appears in nginx, gateway and service logs.
        proxy_set_header X-Request-ID $request_id;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
