name: CI

on:
  push:
    branches: [main, Development]
  pull_request:

# A newer push to the same branch/PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The root `prepare` script installs git hooks, which is meaningless in CI.
  HUSKY: '0'

jobs:
  node:
    name: Node ${{ matrix.node }} (lint, build, type-check, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 24 matches .nvmrc and the service Docker images; 22 is the previous LTS, kept to catch
        # regressions for anyone still on it.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (zero warnings allowed)
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: matrix.node == 24 && always()
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  python:
    name: Python (${{ matrix.worker }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        worker: [ocr-worker-python, parser-worker-python, insights-worker-python]
    defaults:
      run:
        working-directory: apps/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the python:3.11-slim base image of the worker Dockerfiles.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            apps/${{ matrix.worker }}/requirements.txt
            apps/${{ matrix.worker }}/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.worker }}
          path: apps/${{ matrix.worker }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  # Builds every image (no push) so Dockerfile or lockfile breakage is caught before deploy.
  docker:
    name: Docker build (${{ matrix.app }})
    needs: [node, python]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - api-gateway-node
          - upload-service-node
          - analytics-api-node
          - matcher-worker-node
          - export-worker-node
          - frontend-dashboard
          - ocr-worker-python
          - parser-worker-python
          - insights-worker-python
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
